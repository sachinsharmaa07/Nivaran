# Course: INT333 DevOps Advance Configuration Management (LPU)
# Student: Sachin Kumar (Reg: 12316496)

# 1. CPU Load check
command[check_load]=/usr/lib/nagios/plugins/check_load -w 5,4,3 -c 10,8,6

# 2. Root Disk Space check
command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /

# 3. Memory Usage check
command[check_mem]=awk '/MemAvailable/ {avail=$2} /MemTotal/ {total=$2} END {pct=int((total-avail)*100/total); if (pct>90) {print "CRITICAL - Memory " pct "%"; exit 2} else if (pct>80) {print "WARNING - Memory " pct "%"; exit 1} else {print "OK - Memory " pct "%"; exit 0}}' /proc/meminfo

# 4. Application Readiness endpoint check
command[check_readyz]=/usr/lib/nagios/plugins/check_http -H 127.0.0.1 -p 80 -u /readyz -e "ready"

# 5. Docker daemon process status check
command[check_docker]=/usr/lib/nagios/plugins/check_procs -c 1: -C dockerd
