# Nivaran Docker Compose
# SPEC section 11: core profile = data services, app profile = web + api + worker + ai
# Pinned image tags — never use latest.
# All secrets via environment variables from .env file.

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:8.0.4
    profiles: ["core", "app"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

  postgres:
    image: postgis/postgis:17-3.5-alpine
    profiles: ["core", "app"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: nivaran
      POSTGRES_USER: nivaran_owner
      POSTGRES_PASSWORD: nivaran_owner_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivaran_owner -d nivaran"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

  redis:
    image: redis:7.4.3-alpine3.21
    profiles: ["core", "app"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *common-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["core", "app"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *common-logging

  # One-shot bucket initialiser. Uses the minio server image which ships mc CLI.
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["core", "app"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-nivaran}
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        echo "MinIO bucket ready"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: ["core", "app"]
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    logging: *common-logging

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    command: ["node", "dist/worker.js"]
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *common-logging

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5173/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *common-logging

  ai:
    build:
      context: ../..
      dockerfile: apps/ai/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: >
        python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  minio_data:
