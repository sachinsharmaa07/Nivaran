# Nivaran Docker Compose
# SPEC section 11: core profile = data services, app profile = web + api + worker + ai
# Pinned image tags — never use latest.
# All secrets via environment variables from .env file.

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:8.0.4
    profiles: ["core", "app"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

  postgres:
    image: imresamu/postgis:17-3.5
    profiles: ["core", "app"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: nivaran
      POSTGRES_USER: nivaran_owner
      POSTGRES_PASSWORD: nivaran_owner_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivaran_owner -d nivaran"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

  redis:
    image: redis:7.4.3-alpine3.21
    profiles: ["core", "app"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *common-logging

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: ["core", "app"]
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    logging: *common-logging

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      IN_DOCKER: "1"
      PORT: "4000"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      IN_DOCKER: "1"
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'dist/worker.js' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *common-logging

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5173/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *common-logging

  ai:
    build:
      context: ../..
      dockerfile: apps/ai/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: >
        python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *common-logging

volumes:
  mongo_data:
  postgres_data:
  redis_data:
