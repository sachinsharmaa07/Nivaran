# CivicPulse — Nagios Central Monitoring Configuration
# Course: INT333 DevOps Advance Configuration Management (LPU)
# Student: Sachin Kumar (Reg: 12316496)
# Nagios Management Server: 15.206.211.22 (Private IP: 172.31.9.205)
# Monitored Host: CivicPulse EC2 Application Server (Private IP: 172.31.X.X)

define host {
    use                     linux-server
    host_name               civicpulse-app
    alias                   CivicPulse EC2 Application Server
    address                 172.31.X.X
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    d,u,r
}

# 1. Host Alive / ICMP Ping Check
define service {
    use                     generic-service
    host_name               civicpulse-app
    service_description     PING Status
    check_command           check_ping!100.0,20%!500.0,60%
}

# 2. CPU Load Check via NRPE
define service {
    use                     generic-service
    host_name               civicpulse-app
    service_description     CPU Load
    check_command           check_nrpe!check_load
}

# 3. Root Disk Space Check via NRPE
define service {
    use                     generic-service
    host_name               civicpulse-app
    service_description     Disk Space (Root /)
    check_command           check_nrpe!check_disk
}

# 4. Memory Usage Check via NRPE
define service {
    use                     generic-service
    host_name               civicpulse-app
    service_description     Memory Usage
    check_command           check_nrpe!check_mem
}

# 5. Docker Daemon Status via NRPE
define service {
    use                     generic-service
    host_name               civicpulse-app
    service_description     Docker Daemon Status
    check_command           check_nrpe!check_docker
}

# 6. CivicPulse Application Health / Readiness Probe via NRPE
define service {
    use                     generic-service
    host_name               civicpulse-app
    service_description     CivicPulse App Readyz (/readyz)
    check_command           check_nrpe!check_readyz
}

# 7. Direct HTTP Health Check on Port 80
define service {
    use                     generic-service
    host_name               civicpulse-app
    service_description     HTTP Port 80 Health Probe
    check_command           check_http!-p 80 -u /readyz -e "ready"
}
