name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Frontend Testing ─────────────────────────────────────────────────────
  frontend-testing:
    name: 1. Frontend Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Build & Compilation Check
        run: pnpm --filter @nivaran/web build

      - name: Run Frontend Tests
        run: pnpm exec vitest run apps/web

  # ── 2. Backend Testing ──────────────────────────────────────────────────────
  backend-testing:
    name: 2. Backend Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Backend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Compilation Checks
        run: |
          pnpm --filter @nivaran/shared build
          pnpm --filter @nivaran/api build
          pnpm --filter @nivaran/api typecheck

  # ── 3. Docker Image Validation ──────────────────────────────────────────────
  docker-validation:
    name: 3. Docker Image Validation
    needs: [frontend-testing, backend-testing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Frontend and Backend Dockerfiles
        run: |
          docker build --check -f apps/web/Dockerfile .
          docker build --check -f apps/api/Dockerfile .

      - name: Check Docker Compose Configuration
        run: |
          docker compose -f infra/compose/docker-compose.yml config --quiet
          docker compose -f infra/prod/compose.prod.yml config --quiet

  # ── 4 & 5. Docker Image Build & Push to Docker Hub ───────────────────────────
  docker-build-push:
    name: 4 & 5. Docker Build & Push
    needs: [docker-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 4. Build Latest Frontend and Backend Docker Images
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-web:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-web:${{ github.sha }} \
            .
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-api:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-api:${{ github.sha }} \
            .

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Push Images to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-web:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-web:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/civicpulse-api:${{ github.sha }}
